// Fornax: in-process generative models for the JVM via Java's Foreign Function & Memory API.

import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavaPlatform
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    // Maven Central through the Central Portal (see .github/workflows/release.yml)
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

def os = System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux'
def arch = System.getProperty('os.arch').replace('amd64', 'x86_64').replace('aarch64', 'arm64')
def nativeDir = file("build/native/${os}-${arch}-${findProperty('fornax.backend')}")

// The BOM and the natives POM are POMs, not Java libraries.
def pomOnly = ['fornax-bom', 'fornax-natives']

configure(subprojects.findAll { !(it.name in pomOnly) }) {
    apply plugin: 'java-library'

    repositories { mavenCentral() }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
    }
    // Built with JDK 25, for Java 22 and newer: the FFM API is final since 22. -Pfornax.testJdk=22 runs the tests there.
    tasks.withType(JavaCompile).configureEach { options.release = 22 }
    if (findProperty('fornax.testJdk')) {
        tasks.withType(Test).configureEach {
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(findProperty('fornax.testJdk') as int) }
        }
    }

    tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xlint:all,-restricted'] }
    tasks.withType(Javadoc).configureEach { options.addBooleanOption('Xdoclint:none', true) }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        systemProperty 'fornax.library.path', nativeDir.absolutePath
        testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
    }

    if (name != 'fornax-core' && !name.startsWith('fornax-natives-')) dependencies { api project(':fornax-core') }

    tasks.withType(Jar).configureEach {
        manifest { attributes 'Implementation-Title': project.name, 'Implementation-Version': project.version }
        from(rootProject.files('LICENSE', 'NOTICE')) { into 'META-INF' }
    }
}

// What goes to Maven Central, as org.fornax4j:<project name>. The version is gradle.properties' unless -Pversion=...
ext.published = [
    'fornax-core'   : 'Fornax core: native library loading, model download and Hugging Face cache lookup, audio, the model pool and vector search',
    'fornax-llama'  : 'Fornax llama: GGUF language, vision language, embedding and reranker models through llama.cpp, in-process via Java FFM',
    'fornax-jitllm' : 'Fornax jitllm: GGUF language and embedding models through jitllm, a Java inference engine on the GPU via TornadoVM',
    'fornax-tts'    : 'Fornax TTS: text to speech through llama.cpp (mtmd), in-process via Java FFM',
    'fornax-sd'     : 'Fornax SD: images and video through stable-diffusion.cpp, in-process via Java FFM',
    'fornax-acestep': 'Fornax ACE-Step: ACE-Step 1.5 songs through acestep.cpp, in-process via Java FFM',
    'fornax-yue2'   : 'Fornax YuE2: YuE2 songs through yue2.cpp, in-process via Java FFM',
    'fornax-whisper': 'Fornax Whisper: speech to text with word timings through whisper.cpp, in-process via Java FFM',
    'fornax-demucs' : 'Fornax Demucs: stem separation (vocals, drums, bass, ...) with HTDemucs through stems.cpp, in-process via Java FFM',
    'fornax-server' : 'Fornax server: an OpenAI-compatible HTTP API (chat, embeddings, images, speech, transcription) over the Fornax engines, JDK only',
    'fornax-cli'    : 'Fornax CLI: the fornax command (chat, image, song, speak, transcribe, see, pull, server), runnable with JBang: jbang fornax@fornax4j',
]
configure(subprojects.findAll { published.containsKey(it.name) || it.name.startsWith('fornax-natives') || it.name == 'fornax-bom' }) { p ->
    if (p.name in pomOnly) apply plugin: 'java-platform'  // before the publishing plugin's configure below
    apply plugin: 'com.vanniktech.maven.publish'
    def natives = p.name.startsWith('fornax-natives-')
    mavenPublishing {
        configure(p.name in pomOnly ? new JavaPlatform()
                : natives ? new JavaLibrary(new JavadocJar.Empty(), new SourcesJar.Empty())
                          : new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
        publishToMavenCentral()
        signAllPublications()
        coordinates('org.fornax4j', p.name, p.version.toString())
        pom {
            name = p.name
            description = p.name == 'fornax-bom' ? 'Fornax BOM: the versions of every Fornax module and natives jar of this release'
                    : p.name == 'fornax-natives' ? "Fornax natives for the host: Maven picks this OS and arch's natives jar"
                    : natives ? "Fornax's native engine libraries for ${p.name - 'fornax-natives-'}: llama.cpp, " +
                    'stable-diffusion.cpp, acestep.cpp, yue2.cpp, whisper.cpp and stems.cpp, each built into one self-contained library' : published[p.name]
            if (p.name == 'fornax-natives') withXml { p.nativesProfiles(asNode()) }
            if (p.name == 'fornax-bom') withXml { p.markNativesPom(asNode()) }
            if (p.name == 'fornax-cli') withXml { p.hostNatives(asNode()) }
            inceptionYear = '2026'
            url = 'https://fornax4j.org'
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'jasperblues'
                    name = 'Jasper Blues'
                    url = 'https://github.com/jasperblues'
                }
            }
            scm {
                url = 'https://github.com/liberation-data/fornax'
                connection = 'scm:git:https://github.com/liberation-data/fornax.git'
                developerConnection = 'scm:git:ssh://git@github.com/liberation-data/fornax.git'
            }
        }
    }
}

// A natives jar: build/native/<dir>/*.so or *.dylib under org/fornax4j/natives/<os>-<arch>-<backend>/, where
// NativeLibrary finds them on the classpath (see BundledNatives). settings.gradle includes one per built platform.
def engineLibraries = ['fornax_llama', 'fornax_tts', 'stable-diffusion', 'fornax_acestep', 'fornax_yue2', 'fornax_whisper', 'fornax_demucs']
configure(subprojects.findAll { it.name.startsWith('fornax-natives-') }) { p ->
    def platform = p.name - 'fornax-natives-'
    def libs = gradle.nativesDirs[platform]  // from settings.gradle, which maps macos-aarch64 to build.sh's arm64 dir
    def ext = platform.startsWith('macos-') ? 'dylib' : 'so'
    tasks.named('jar', Jar) {
        from(libs) { include "*.$ext"; into "org/fornax4j/natives/$platform" }
        // The name the JDK would derive from the file name has a segment that starts with a digit ("64"), which the
        // module path rejects, so name it: org.fornax4j.natives.linux_x86_64_vulkan.
        manifest { attributes 'Automatic-Module-Name': "org.fornax4j.natives.${platform.replace('-', '_')}" }
        // A release ships every engine; a local build may have only some of them.
        def required = providers.gradleProperty('fornax.natives.require').map { it.toBoolean() }.getOrElse(false)
        if (required) doFirst {
            def missing = engineLibraries.collect { "lib${it}.$ext" }.findAll { !new File(libs, it).isFile() }
            if (missing) throw new GradleException("$platform natives are missing $missing in $libs")
        }
    }
}

project(':fornax-examples') {
    dependencies {
        implementation project(':fornax-llama')
        implementation project(':fornax-jitllm')
        implementation project(':fornax-tts')
        implementation project(':fornax-sd')
        implementation project(':fornax-acestep')
        implementation project(':fornax-yue2')
        implementation project(':fornax-whisper')
        implementation project(':fornax-demucs')
    }
    // The docs' Java blocks: src/snippets/java, compiled (never run) by every build, and copied into README.md and the
    // website's pages by scripts/Snippets.java. checkSnippets fails the build when a doc's block differs from its
    // region, so an API change that breaks an example breaks the build. ./gradlew syncSnippets rewrites the blocks.
    sourceSets { snippets { compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output } }
    // SnippetsTest calls the script's methods, so the tests compile it too
    sourceSets { test { java { srcDir rootProject.file('scripts') } } }
    // the language-models guide's JSON examples use Jackson, as an app would
    dependencies { snippetsImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0' }
    // the OpenAI-server guide starts a FornaxServer
    dependencies { snippetsImplementation project(':fornax-server') }
    def snippetJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    def docs = rootProject.fileTree(rootProject.projectDir) { include 'README.md', 'website/src/content/docs/**/*.md', 'website/src/content/docs/**/*.mdx' }
    def checkSnippets = tasks.register('checkSnippets', Exec) {
        group = 'verification'
        description = 'Fails when a Java block in the docs differs from its snippet (or has none)'
        dependsOn 'compileSnippetsJava'
        inputs.files(docs, sourceSets.snippets.java, rootProject.file('scripts/Snippets.java'))
        def stamp = layout.buildDirectory.file('check-snippets.ok')
        outputs.file(stamp)
        workingDir = rootProject.projectDir
        executable = snippetJava.get().executablePath.asFile
        args 'scripts/Snippets.java', '--check'
        doLast { stamp.get().asFile.text = 'ok' }
    }
    tasks.register('syncSnippets', Exec) {
        group = 'documentation'
        description = 'Copies each snippet region into its Java block in the docs'
        dependsOn 'compileSnippetsJava'
        workingDir = rootProject.projectDir
        executable = snippetJava.get().executablePath.asFile
        args 'scripts/Snippets.java'
    }
    tasks.named('check') { dependsOn checkSnippets }
    // ./gradlew chat --args='"your prompt"'   image --args='klein out.png "a prompt"'   song   yue2
    // speak --args='out.wav "text" am_michael' -Pmodel=kokoro
    // see --args='image.png "question"' -Pmodel=qwen3-vl-4b -Pschema=schema.json   invoice   defects
    // edit --args='in.png out.png "a prompt"' -Pmask=m.png -Pstrength=0.6 -Plora=style.safetensors:0.8   upscale --args='in.png out.png'
    // transcribe --args='audio.wav'   search --args='docs "how do I cancel a call?"' -Pk=5 -Prerank=false   separate --args='song.wav'
    [chat: 'Chat', image: 'Image', edit: 'Edit', upscale: 'Upscale', song: 'Song', yue2: 'Yue2Song', single: 'Single', video: 'VideoClip', speak: 'Speak', speakBatch: 'SpeakBatch', see: 'See', invoice: 'Invoice', defects: 'Defects', transcribe: 'Transcribe', search: 'Search', separate: 'Separate'].each { task, cls ->
        tasks.register(task, JavaExec) {
            group = 'fornax examples'
            description = "Runs org.liberationdata.fornax.examples.${cls}"
            classpath = sourceSets.main.runtimeClasspath
            mainClass = "org.liberationdata.fornax.examples.${cls}"
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            jvmArgs '--enable-native-access=ALL-UNNAMED'
            systemProperty 'fornax.library.path', nativeDir.absolutePath
            workingDir = rootProject.projectDir
            // -Pmodel=... -Psteps=... etc. become system properties (only ones given on the command line), and so do
            // NativeLibrary's tunables, which the forked JVM would not see as -D on gradlew
            def cli = gradle.startParameter.projectProperties
            ['fornax.gpu.graphs', 'fornax.vulkan.maxNodesPerSubmit', 'fornax.allowCpu', 'model', 'mmproj', 'llm', 'steps', 'width', 'height', 'seed', 'repeat', 'dit', 'lm', 'quant', 'frames', 'fps', 'cfg', 'ltx.dir', 'recipe', 'audio', 'preprocess', 'hires', 'upscaler', 'refine', 'strength', 'schema',
             'mask', 'lora', 'ref', 'shift', 'sampler', 'scheduler', 'factor', 'tile', 'control', 'controlnet', 'controlStrength', 'k', 'rerank', 'song', 'song.start'].each { p ->
                if (cli.containsKey(p)) systemProperty p, cli[p]
            }
        }
    }
}

