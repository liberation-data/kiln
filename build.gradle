// The tests on a Mac over SSH, against Metal: scripts/test-on-mac.sh, with the host from -Pfornax.macHost (or
// ~/.gradle/gradle.properties). A Linux machine can't run the Metal build, so this is how it gets tested.
tasks.register('testOnMac', Exec) {
    group = 'verification'
    description = 'Runs the tests on a Mac over SSH against the Metal backend (-Pfornax.macHost=<host>)'
    def host = providers.gradleProperty('fornax.macHost')
    def args = providers.gradleProperty('fornax.macTestArgs')
    doFirst { if (!host.present) throw new GradleException('Set the Mac to test on: -Pfornax.macHost=<host>') }
    executable = file('scripts/test-on-mac.sh')
    argumentProviders.add({ [host.getOrElse('')] + (args.present ? args.get().tokenize(' ') : []) } as CommandLineArgumentProvider)
}

project(':fornax-studio-server') {
    apply plugin: 'application'
    dependencies {
        implementation project(':fornax-llama')
        implementation project(':fornax-sd')
        implementation project(':fornax-acestep')
        implementation project(':fornax-yue2')
    }
    application {
        mainClass = 'org.liberationdata.fornax.studio.StudioServer'
        applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
    }
    // ./gradlew studioServer: the backend on its own, for the studio's dev server to talk to (-Pport=7860, -Pstub=image,song,video)
    tasks.register('studioServer', JavaExec) {
        group = 'fornax examples'
        description = 'Runs the Fornax Studio backend'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'org.liberationdata.fornax.studio.StudioServer'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        systemProperty 'fornax.library.path', nativeDir.absolutePath
        // ggml-vulkan's default of 100 nodes a submission lets one LTX decode outlast amdgpu's compute timeout (docs/engine-notes.md).
        environment 'GGML_VK_MAX_NODES_PER_SUBMIT', System.getenv('GGML_VK_MAX_NODES_PER_SUBMIT') ?: '8'
        def cli = gradle.startParameter.projectProperties
        ['port', 'stub', 'budget', 'ffmpeg'].each { p -> if (cli.containsKey(p)) systemProperty "fornax.studio.${p}", cli[p] }
    }
    // One jar holding the server and the Fornax modules it uses: what the desktop app ships and starts with `java -jar`.
    tasks.register('studioJar', Jar) {
        group = 'build'
        description = 'The Fornax Studio backend as one runnable jar'
        archiveFileName = 'fornax-studio-server.jar'
        manifest { attributes 'Main-Class': 'org.liberationdata.fornax.studio.StudioServer', 'Enable-Native-Access': 'ALL-UNNAMED' }
        from sourceSets.main.output
        dependsOn configurations.runtimeClasspath
        from { configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) } }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}
