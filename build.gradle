project(':fornax-cli') {
    apply plugin: 'application'
    // The natives, as the samples take them: a fornax-natives jar, here every one this build has (settings.gradle
    // includes a platform when native/build.sh has built it). -Pfornax.cli.nativesVersion=0.2.0 takes this platform's
    // from Maven Central instead, for a build without natives of its own.
    def publishedNatives = findProperty('fornax.cli.nativesVersion')
    def hostPlatform = os != 'macos' ? 'linux-x86_64-vulkan' : (arch == 'arm64' ? 'macos-aarch64-metal' : 'macos-x86_64-metal')
    def natives = publishedNatives ? ["org.fornax4j:fornax-natives-${hostPlatform}:${publishedNatives}".toString()]
                                   : gradle.nativesDirs.keySet().collect { project(":fornax-natives-${it}") }
    dependencies {
        implementation project(':fornax-llama')
        implementation project(':fornax-jitllm')
        implementation project(':fornax-sd')
        implementation project(':fornax-acestep')
        implementation project(':fornax-yue2')
        implementation project(':fornax-tts')
        implementation project(':fornax-whisper')
        implementation project(':fornax-server')
        // 0.1.0's natives jar says Java 25 in its metadata (it holds no classes), so ask for it as 25
        natives.each { n -> runtimeOnly(n) { attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) } } }
    }
    // ./gradlew :fornax-cli:installDist  ->  fornax-cli/build/install/fornax-cli/bin/fornax, with its jars in lib/.
    // The launchers are src/dist/bin/fornax and fornax.cmd, not Gradle's: their inputs (the java, the jars folder, the
    // natives folder) are environment variables or placeholders an installer such as Fornax Studio fills in.
    application {
        mainClass = 'org.liberationdata.fornax.cli.Main'
        applicationName = 'fornax'
        applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
    }
    tasks.named('startScripts') { enabled = false }
    // `jbang org.fornax4j:fornax-cli:<version>` runs the jar's Main-Class.
    tasks.named('jar', Jar) { manifest { attributes 'Main-Class': application.mainClass.get() } }
    // Published, the CLI takes the host's natives through org.fornax4j:fornax-natives, whose profiles Maven (and JBang,
    // which resolves as Maven does) activate by OS and arch; not the natives jars this build happened to have.
    // Gradle Module Metadata would name this build's natives jar for every platform: without it, Gradle reads the POM.
    tasks.withType(GenerateModuleMetadata).configureEach { enabled = false }
    ext.hostNatives = { Node pom ->
        def deps = pom.dependencies[0]
        deps.dependency.findAll { it.artifactId.text().startsWith('fornax-natives-') }.each { deps.remove(it) }
        // A module of this build that isn't published would be a dependency nobody (JBang, Maven) can resolve
        def unpublished = deps.dependency.findAll { it.groupId.text() == 'org.fornax4j' }*.artifactId*.text()
                .findAll { !rootProject.ext.published.containsKey(it) }
        if (unpublished) throw new GradleException("fornax-cli depends on $unpublished, which aren't published: add them to published")
        def n = deps.appendNode('dependency')
        n.appendNode('groupId', 'org.fornax4j')
        n.appendNode('artifactId', 'fornax-natives')
        n.appendNode('version', project.version.toString())
        n.appendNode('type', 'pom')
        n.appendNode('scope', 'runtime')
    }
    distributions {
        main {
            distributionBaseName = 'fornax-cli'
            contents { filesMatching('bin/fornax') { it.permissions { unix('rwxr-xr-x') } } }
        }
    }
    // ./gradlew :fornax-cli:run --args='info'
    tasks.named('run', JavaExec) {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        systemProperty 'fornax.library.path', nativeDir.absolutePath
        standardInput = System.in
    }
    // The launcher as an installer renders it, run against the installed distribution (see LauncherTest)
    tasks.named('test') {
        dependsOn 'installDist'
        systemProperty 'fornax.cli.install', layout.buildDirectory.dir('install/fornax-cli').get().asFile.absolutePath
        systemProperty 'fornax.jbang.catalog', rootProject.file('jbang-catalog.json').absolutePath
        inputs.file(rootProject.file('jbang-catalog.json'))
    }
}

