// Plugins come from the Gradle Plugin Portal, with Maven Central as a fallback: the publishing plugin is on both, and a
// Portal hiccup once failed a release dry run.
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'fornax'

include 'fornax-core'     // native library loading, Hugging Face cache lookup, audio
include 'fornax-llama'    // llama.cpp: GGUF language models
include 'fornax-jitllm'   // jitllm: GGUF language models in Java, on the GPU through TornadoVM
include 'fornax-tts'      // llama.cpp text to speech: Kokoro, ZONOS3, LFM3-Audio, ...
include 'fornax-sd'       // stable-diffusion.cpp: FLUX, Qwen-Image, SD, Wan, LTX
include 'fornax-acestep'  // acestep.cpp: ACE-Step 1.5 songs
include 'fornax-yue2'     // yue2.cpp: YuE2 songs
include 'fornax-whisper'  // whisper.cpp: speech to text with word timings
include 'fornax-demucs'   // stems.cpp: HTDemucs stem separation (vocals and backing)
include 'fornax-bom'      // the BOM: every published module's version, imported once
include 'fornax-natives'  // the natives jar for the host: Maven picks it by OS profile
include 'fornax-server'   // an OpenAI-compatible HTTP server for the engines, JDK only
include 'fornax-cli'      // the fornax command: pull, list, chat, test, info, server
include 'fornax-examples' // runnable demos (not published)
include 'fornax-bench'    // A/B against ComfyUI's HTTP API (not published)
include 'fornax-studio-server' // the local HTTP backend Fornax Studio (the desktop app) starts (not published)

// Natives jars, org.fornax4j:fornax-natives-<os>-<arch>-<backend>: the engines' libraries from build/native/ (see
// native/build.sh), one jar per platform and backend. A platform is included only when its libraries have been built,
// unless -Pfornax.natives.require=true (the release build), which fails on a missing one. -Pfornax.natives=... lists others.
def nativePlatforms = providers.gradleProperty('fornax.natives')
        .getOrElse('linux-x86_64-vulkan,macos-aarch64-metal,macos-x86_64-metal').split(',')*.trim()
def requireNatives = providers.gradleProperty('fornax.natives.require').getOrElse('false').toBoolean()
gradle.ext.nativePlatforms = nativePlatforms  // every platform a release publishes a natives jar for
gradle.ext.nativesDirs = [:]  // platform -> its build/native/ directory, for the natives jars in build.gradle
nativePlatforms.each { platform ->
    // native/build.sh names a directory by `uname -m`, which is arm64 on macOS
    def built = file("build/native/${platform.startsWith('macos-aarch64-') ? platform.replace('aarch64', 'arm64') : platform}")
    if (!built.isDirectory()) {
        if (requireNatives) throw new GradleException("No native libraries for $platform in $built (run native/build.sh)")
        return
    }
    gradle.ext.nativesDirs[platform] = built
    def name = "fornax-natives-$platform"
    include name
    def dir = file("build/fornax-natives/$platform")  // a project needs a directory; this one has nothing in it
    dir.mkdirs()
    project(":$name").projectDir = dir
}
